AWSTemplateFormatVersion: "2010-09-09"
Description: >
  One-time bootstrap (deploy manually with admin credentials): GitHub OIDC provider, a deploy
  role GitHub Actions can assume without any stored keys, a separate CloudFormation execution
  role, an ECR repository and an artifact bucket for packaged Lambda code.

Parameters:
  GitHubOrg:
    Type: String
    Description: GitHub user or organisation that owns the repository
  GitHubRepo:
    Type: String
    Description: Repository name
  DeployBranch:
    Type: String
    Default: main
    Description: Only workflows running on this branch may assume the deploy role
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Set to false if the account already has the token.actions.githubusercontent.com provider
  AppStackPrefix:
    Type: String
    Default: docsvc-app
    Description: Stacks named <prefix>-* are the ones the deploy role may manage

Conditions:
  NewOidcProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: NewOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: docsvc/document-service
      ImageTagMutability: IMMUTABLE # every build is tagged with its commit SHA
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Keep last 20 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":20},"action":{"type":"expire"}}]}

  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub docsvc-artifacts-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-packages
            Status: Enabled
            ExpirationInDays: 90

  # Role GitHub Actions assumes through OIDC. It cannot create resources itself: it can only
  # push images, upload packaged code, drive CloudFormation, and hand the execution role below
  # to CloudFormation.
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: docsvc-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - NewOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/${DeployBranch}
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: EcrPush
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt EcrRepository.Arn
              - Sid: UploadPackagedCode
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub ${ArtifactBucket.Arn}/*
              - Sid: ListArtifactBucket
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ArtifactBucket.Arn
              - Sid: ManageAppStacks
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:CreateStack
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:UpdateStack
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStackPrefix}-*/*
              - Sid: ValidateTemplates
                Effect: Allow
                Action: cloudformation:ValidateTemplate
                Resource: "*"
              - Sid: HandExecutionRoleToCloudFormation
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com

  # The role CloudFormation uses to create the app stack's resources. Scoped to docsvc-* names.
  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: docsvc-cfn-execution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: app-stack-resources
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Buckets
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:DeleteBucketPolicy
                  - s3:GetBucketNotification
                  - s3:GetBucketOwnershipControls
                  - s3:GetBucketPolicy
                  - s3:GetBucketPublicAccessBlock
                  - s3:GetEncryptionConfiguration
                  - s3:ListBucket
                  - s3:PutBucketNotification
                  - s3:PutBucketOwnershipControls
                  - s3:PutBucketPolicy
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutBucketTagging
                  - s3:PutEncryptionConfiguration
                Resource: arn:aws:s3:::docsvc-*
              - Sid: ReadPackagedLambdaCode
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${ArtifactBucket.Arn}/*
              - Sid: Lambda
                Effect: Allow
                Action:
                  - lambda:AddPermission
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:DeleteFunctionEventInvokeConfig
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:GetFunctionEventInvokeConfig
                  - lambda:GetPolicy
                  - lambda:ListTags
                  - lambda:PutFunctionEventInvokeConfig
                  - lambda:RemovePermission
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:UpdateFunctionEventInvokeConfig
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:docsvc-*
              - Sid: ProcessorRole
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:PutRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/docsvc-*-processor-role
              - Sid: PassProcessorRoleToLambda
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/docsvc-*-processor-role
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Sid: LogGroups
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:ListTagsForResource
                  - logs:PutRetentionPolicy
                  - logs:TagResource
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/docsvc-*
              - Sid: DescribeLogGroups
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"
              - Sid: Alarms
                Effect: Allow
                Action:
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:ListTagsForResource
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:TagResource
                Resource: !Sub arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:docsvc-*
              - Sid: DescribeAlarms
                Effect: Allow
                Action: cloudwatch:DescribeAlarms
                Resource: "*"
              - Sid: AlarmTopic
                Effect: Allow
                Action:
                  - sns:CreateTopic
                  - sns:DeleteTopic
                  - sns:GetSubscriptionAttributes
                  - sns:GetTopicAttributes
                  - sns:ListTagsForResource
                  - sns:SetTopicAttributes
                  - sns:Subscribe
                  - sns:TagResource
                  - sns:Unsubscribe
                Resource: !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:docsvc-*

Outputs:
  DeployRoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
    Description: GitHub repo variable AWS_DEPLOY_ROLE_ARN
  CloudFormationExecutionRoleArn:
    Value: !GetAtt CloudFormationExecutionRole.Arn
    Description: GitHub repo variable CFN_EXECUTION_ROLE_ARN
  EcrRepositoryName:
    Value: !Ref EcrRepository
    Description: GitHub repo variable ECR_REPOSITORY
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
    Description: GitHub repo variable ARTIFACT_BUCKET
